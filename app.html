<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GOJO Study Planner</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: auto;
        }

        header {
            text-align: center;
            padding: 40px 10px 25px;
        }

        header h1 {
            font-size: 48px;
            margin: 0;
        }

        header p {
            color: #888;
            margin-top: 8px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            background: #141414;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 18px;
            text-align: center;
        }

        .stat h2 {
            margin: 5px;
            font-size: 28px;
        }

        .stat p {
            color: #888;
            margin: 5px;
            font-size: 14px;
        }

        .progressBox,
        .form {
            background: #141414;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .progressBar {
            width: 100%;
            height: 14px;
            background: #252525;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: white;
            transition: width 0.3s;
        }

        .form h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 6px 0;
            background: #0b0b0b;
            color: white;
            border: 1px solid #333;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            padding: 11px 15px;
            margin: 5px 3px 0 0;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 14px;
        }

        #addButton {
            width: 100%;
            background: white;
            color: black;
            margin-top: 10px;
            font-weight: bold;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            background: #141414;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 18px;
            margin: 12px 0;
        }

        .taskName {
            font-size: 19px;
            font-weight: bold;
        }

        .subject {
            color: #aaa;
            margin-top: 7px;
        }

        .deadline {
            color: #777;
            margin-top: 5px;
        }

        .complete {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .deleteButton {
            background: #292929;
            color: white;
        }

        .empty {
            text-align: center;
            color: #666;
            padding: 30px;
        }

        footer {
            text-align: center;
            color: #555;
            padding: 40px 0;
            font-size: 14px;
        }

        /* PHONE DESIGN */

        @media (max-width: 600px) {

            header {
                padding-top: 25px;
            }

            header h1 {
                font-size: 38px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .stat {
                padding: 14px;
            }

            .stat h2 {
                font-size: 25px;
            }

            .form,
            .progressBox {
                padding: 17px;
            }

            li {
                padding: 16px;
            }

            button {
                padding: 10px 13px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <header>

        <h1>📚 GOJO</h1>

        <p>
            STUDY PLANNER
        </p>

    </header>


    <!-- DASHBOARD -->

    <div class="dashboard">

        <div class="stat">

            <h2 id="totalTasks">0</h2>

            <p>Total Tasks</p>

        </div>


        <div class="stat">

            <h2 id="completedTasks">0</h2>

            <p>Completed</p>

        </div>


        <div class="stat">

            <h2 id="progressText">0%</h2>

            <p>Progress</p>

        </div>

    </div>


    <!-- PROGRESS -->

    <div class="progressBox">

        <h3>🎯 Your Progress</h3>

        <div class="progressBar">

            <div
                class="progress"
                id="progress">
            </div>

        </div>

    </div>


    <!-- ADD TASK -->

    <div class="form">

        <h2>➕ Add Task</h2>


        <input
            type="text"
            id="task"
            placeholder="What do you need to do?"
        >


        <input
            type="text"
            id="subject"
            placeholder="Subject"
        >


        <input
            type="date"
            id="deadline"
        >


        <button
            id="addButton"
            onclick="addTask()"
        >
            Add Task
        </button>

    </div>


    <!-- TASKS -->

    <h2>📋 My Tasks</h2>


    <ul id="taskList"></ul>


    <footer>

        GOJO • Learning today. Building tomorrow. 🇰🇪

    </footer>


</div>



<script>


    let tasks =
        JSON.parse(
            localStorage.getItem("gojoTasks")
        ) || [];



    function saveTasks() {

        localStorage.setItem(
            "gojoTasks",
            JSON.stringify(tasks)
        );

    }



    function updateDashboard() {

        let total =
            tasks.length;


        let completed =
            tasks.filter(function(task) {

                return task.completed;

            }).length;


        let percentage = 0;


        if (total > 0) {

            percentage =
                Math.round(
                    (completed / total) * 100
                );

        }


        document.getElementById(
            "totalTasks"
        ).textContent = total;


        document.getElementById(
            "completedTasks"
        ).textContent = completed;


        document.getElementById(
            "progressText"
        ).textContent =
            percentage + "%";


        document.getElementById(
            "progress"
        ).style.width =
            percentage + "%";

    }



    function displayTasks() {


        let list =
            document.getElementById(
                "taskList"
            );


        list.innerHTML = "";


        if (tasks.length === 0) {

            list.innerHTML =
                '<div class="empty">No tasks yet. Add your first task! 🚀</div>';

        }


        tasks.forEach(function(task, index) {


            let item =
                document.createElement("li");


            let taskName =
                document.createElement("div");


            taskName.className =
                "taskName";


            taskName.textContent =
                task.name;


            if (task.completed) {

                taskName.classList.add(
                    "complete"
                );

            }


            let subject =
                document.createElement("div");


            subject.className =
                "subject";


            subject.textContent =
                "📚 " + task.subject;


            let deadline =
                document.createElement("div");


            deadline.className =
                "deadline";


            deadline.textContent =
                "📅 " + task.deadline;



            let completeButton =
                document.createElement(
                    "button"
                );


            completeButton.textContent =
                task.completed
                ? "Undo"
                : "Complete";


            completeButton.onclick =
                function() {


                    tasks[index].completed =
                        !tasks[index].completed;


                    saveTasks();

                    displayTasks();

                };



            let deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.textContent =
                "Delete";


            deleteButton.className =
                "deleteButton";


            deleteButton.onclick =
                function() {


                    tasks.splice(
                        index,
                        1
                    );


                    saveTasks();

                    displayTasks();

                };



            item.appendChild(
                taskName
            );


            item.appendChild(
                subject
            );


            item.appendChild(
                deadline
            );


            item.appendChild(
                completeButton
            );


            item.appendChild(
                deleteButton
            );


            list.appendChild(
                item
            );


        });


        updateDashboard();

    }



    function addTask() {


        let name =
            document.getElementById(
                "task"
            ).value;


        let subject =
            document.getElementById(
                "subject"
            ).value;


        let deadline =
            document.getElementById(
                "deadline"
            ).value;



        if (name === "") {

            alert(
                "Please enter a task!"
            );

            return;

        }



        let newTask = {

            name: name,

            subject:
                subject || "General",

            deadline:
                deadline || "No deadline",

            completed: false

        };



        tasks.push(
            newTask
        );


        saveTasks();


        displayTasks();



        document.getElementById(
            "task"
        ).value = "";


        document.getElementById(
            "subject"
        ).value = "";


        document.getElementById(
            "deadline"
        ).value = "";

    }



    displayTasks();


</script>


</body>
</html>
