<!DOCTYPE html>
<html>
<head>
    <title>GOJO Study Planner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        h1 {
            font-size: 48px;
            margin: 0;
        }

        .subtitle {
            color: #888;
            font-size: 18px;
        }

        .dashboard {
            display: flex;
            gap: 15px;
            margin: 30px 0;
        }

        .stat {
            flex: 1;
            background: #141414;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat h2 {
            margin: 5px;
            font-size: 30px;
        }

        .stat p {
            color: #888;
            margin: 5px;
        }

        .progressBox {
            background: #141414;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .progressBar {
            height: 15px;
            background: #252525;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: white;
            transition: 0.3s;
        }

        .form {
            background: #141414;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            margin: 5px;
            background: #0b0b0b;
            color: white;
            border: 1px solid #333;
            border-radius: 8px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #addButton {
            background: white;
            color: black;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            background: #141414;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
        }

        .taskName {
            font-size: 21px;
            font-weight: bold;
        }

        .subject {
            color: #aaa;
            margin-top: 7px;
        }

        .deadline {
            color: #777;
            margin-top: 5px;
        }

        .complete {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .deleteButton {
            background: #292929;
            color: white;
        }

        @media (max-width: 650px) {

            .dashboard {
                flex-direction: column;
            }

            h1 {
                font-size: 38px;
            }

            input {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>📚 GOJO</h1>
        <p class="subtitle">
            STUDY PLANNER
        </p>
    </header>


    <div class="dashboard">

        <div class="stat">
            <h2 id="totalTasks">0</h2>
            <p>Total Tasks</p>
        </div>

        <div class="stat">
            <h2 id="completedTasks">0</h2>
            <p>Completed</p>
        </div>

        <div class="stat">
            <h2 id="progressText">0%</h2>
            <p>Progress</p>
        </div>

    </div>


    <div class="progressBox">

        <h3>🎯 Your Progress</h3>

        <div class="progressBar">
            <div class="progress" id="progress"></div>
        </div>

    </div>


    <div class="form">

        <h2>➕ Add a Task</h2>

        <input
            type="text"
            id="task"
            placeholder="Task"
        >

        <input
            type="text"
            id="subject"
            placeholder="Subject"
        >

        <input
            type="date"
            id="deadline"
        >

        <br>

        <button
            id="addButton"
            onclick="addTask()"
        >
            Add Task
        </button>

    </div>


    <h2>📋 Your Tasks</h2>

    <ul id="taskList"></ul>

</div>


<script>

    let tasks =
        JSON.parse(localStorage.getItem("gojoTasks")) || [];


    function saveTasks() {

        localStorage.setItem(
            "gojoTasks",
            JSON.stringify(tasks)
        );

    }


    function updateDashboard() {

        let total = tasks.length;

        let completed =
            tasks.filter(function(task) {
                return task.completed;
            }).length;

        let percentage = 0;

        if (total > 0) {
            percentage =
                Math.round((completed / total) * 100);
        }

        document.getElementById("totalTasks")
            .textContent = total;

        document.getElementById("completedTasks")
            .textContent = completed;

        document.getElementById("progressText")
            .textContent = percentage + "%";

        document.getElementById("progress")
            .style.width = percentage + "%";
    }


    function displayTasks() {

        let list =
            document.getElementById("taskList");

        list.innerHTML = "";


        tasks.forEach(function(task, index) {

            let item =
                document.createElement("li");


            let taskName =
                document.createElement("div");

            taskName.className =
                "taskName";

            taskName.textContent =
                task.name;


            if (task.completed) {

                taskName.classList.add("complete");

            }


            let subject =
                document.createElement("div");

            subject.className =
                "subject";

            subject.textContent =
                "📚 Subject: " + task.subject;


            let deadline =
                document.createElement("div");

            deadline.className =
                "deadline";

            deadline.textContent =
                "📅 Deadline: " + task.deadline;


            let completeButton =
                document.createElement("button");

            completeButton.textContent =
                task.completed
                ? "Undo"
                : "Complete";


            completeButton.onclick =
                function() {

                    tasks[index].completed =
                        !tasks[index].completed;

                    saveTasks();

                    displayTasks();

                };


            let deleteButton =
                document.createElement("button");

            deleteButton.textContent =
                "Delete";

            deleteButton.className =
                "deleteButton";


            deleteButton.onclick =
                function() {

                    tasks.splice(index, 1);

                    saveTasks();

                    displayTasks();

                };


            item.appendChild(taskName);

            item.appendChild(subject);

            item.appendChild(deadline);

            item.appendChild(completeButton);

            item.appendChild(deleteButton);


            list.appendChild(item);

        });


        updateDashboard();

    }


    function addTask() {

        let name =
            document.getElementById("task").value;

        let subject =
            document.getElementById("subject").value;

        let deadline =
            document.getElementById("deadline").value;


        if (name === "") {

            alert("Please enter a task!");

            return;

        }


        let newTask = {

            name: name,

            subject:
                subject || "General",

            deadline:
                deadline || "No deadline",

            completed: false

        };


        tasks.push(newTask);

        saveTasks();

        displayTasks();


        document.getElementById("task").value = "";

        document.getElementById("subject").value = "";

        document.getElementById("deadline").value = "";

    }


    displayTasks();

</script>

</body>
</html>
